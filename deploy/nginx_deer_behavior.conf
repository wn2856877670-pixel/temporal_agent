worker_processes 4;

error_log /root/autodl-tmp/deer_behavior_clean/logs/nginx_error.log warn;
pid /root/autodl-tmp/deer_behavior_clean/logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 4096m;
    client_body_timeout 3600s;
    proxy_connect_timeout 75s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_request_buffering off;

    upstream deer_fastapi {
        server 127.0.0.1:6011;
        keepalive 16;
    }

    server {
        listen 6008;
        server_name _;

        location /media/ {
            alias /var/www/deer_behavior_media/;
            add_header Accept-Ranges bytes always;
            add_header Cache-Control "public, max-age=3600" always;
        }

        location /static/ {
            alias /var/www/deer_behavior_static/;
            expires 1h;
            add_header Cache-Control "public, max-age=3600" always;
        }

        location / {
            proxy_pass http://deer_fastapi;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
