worker_processes 1;
pid /root/autodl-tmp/deer_behavior_clean/logs/nginx_business.pid;
error_log /root/autodl-tmp/deer_behavior_clean/logs/nginx_business_error.log;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server {
        listen 6010;
        server_name _;
        root /var/www/deer-business;
        client_max_body_size 4096m;
        location /api/internal/ { return 404; }
        location /api/ {
            proxy_pass http://127.0.0.1:6020;
            proxy_request_buffering off;
            proxy_read_timeout 120s;
            client_body_timeout 3600s;
        }
        # Existing result URLs stay unchanged; no uploads, metadata or DB files.
        location ~ "^/media/business/results/(?<result_video>(?:[A-Za-z0-9_-][A-Za-z0-9_.-]*/)+[A-Za-z0-9_-][A-Za-z0-9_.-]*\.(?:mp4|webm))$" {
            alias /var/lib/deer-business/results/$result_video;
            disable_symlinks on;
            autoindex off;
            limit_except GET HEAD { deny all; }
            add_header Cache-Control "private, max-age=3600";
        }
        location /media/ { return 404; }
        location /assets/ { expires 1y; try_files $uri =404; }
        location / { add_header Cache-Control "no-cache"; try_files $uri $uri/ /index.html; }
    }
}
